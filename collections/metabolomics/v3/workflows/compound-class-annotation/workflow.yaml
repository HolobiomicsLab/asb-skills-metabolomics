schema_version: 0.3.0
workflow_id: compound_class_annotation
kind: composite-workflow
techniques: []
steps:
- id: preprocess
  goal: raw mzML -> feature table + SIRIUS-flavour MS2 export
  edam_operation: http://edamontology.org/operation_3215
  skills:
  - lc-msms-feature-detection
  - mass-spectrometry-feature-detection
  - lc-ms-feature-quantification-processing
  - lc-ms-feature-detection--e300bd20a9eef616
  tools:
  - COSMIC
  - CSI:FingerID
  - SIRIUS 4
  inputs:
  - type: mzML
  outputs:
  - type: feature-table
  - type: mgf
    flavour: sirius
  grounding:
    kb_slugs:
    - asb-paper-10-1021-acscentsci-3c00800
    - asb-paper-10-1038-nprot-2017-122
    - asb-paper-10-1038-s41587-021-01045-9
    - asb-paper-10-1038-s41589-020-00677-3
