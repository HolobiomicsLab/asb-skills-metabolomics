  - fingerprint
  candidate_tools:
  - mibig_classifications
  - ConCISE
  - Python
  - TensorFlow
  - TensorFlow 2.3.0
  - docker
  - docker-compose
  inputs_from:
    fingerprint:
    - tsv
- id: consolidate
  goal: consolidate formula + fingerprint + class into a class-annotated feature table
  edam_operation: http://edamontology.org/operation_3434
  skills:
  - mass-spectrometry-feature-table-processing
  - mass-spectrometry-feature-annotation-qc
  - insilico-ms2-annotation-sirius-canopus
  - batch-ms2-annotation-automation
  tools:
  - ConCISE
  - GNPS
  - Python
  inputs:
  - type: feature-table
  - type: tsv
  outputs:
  - type: tsv
  grounding:
    kb_slugs:
    - asb-paper-10-1021-acscentsci-3c00800
    - asb-paper-10-3390-metabo12121275
    dois:
    - 10.1021/acscentsci.3c00800
    - 10.3390/metabo12121275
  after:
  - preprocess
  - classify
  candidate_tools:
  - CANOPUS
  - ClassyFire
  - SIRIUS
  - ENPKG
  - ENPKG (04_enpkg_sirius_canopus)
  - MZmine
  - RDF
  - matchms
  - NPClassifier
  inputs_from:
