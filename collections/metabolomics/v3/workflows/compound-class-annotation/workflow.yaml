  - CSI:FingerID
  - GNPS
  - MZmine2
  - QIIME 2
  - Qemistree
  - SIRIUS
  - q2-qemistree
  inputs:
  - type: tsv
  outputs:
  - type: tsv
  grounding:
    kb_slugs:
    - asb-paper-10-1038-s41589-020-00677-3
    - asb-paper-10-1038-s41592-022-01486-3
