  - molecular-formula-reranking-zodiac
  - molecular-formula-determination-isotope-fragmentation
  - isotope-pattern-based-formula-ranking
  - molecular-formula-gibbs-sampling
  tools:
  - CSI:FingerID
  - QIIME 2
  - Qemistree
  - SIRIUS
  - ZODIAC
  - q2-qemistree
  inputs:
  - type: mgf
    flavour: sirius
  outputs:
  - type: tsv
  grounding:
    kb_slugs:
    - asb-paper-10-1038-s41587-021-01045-9
    - asb-paper-10-1038-s41589-020-00677-3
    - asb-paper-10-1038-s41592-019-0344-8
    - asb-paper-10-1038-s42256-020-00234-6
