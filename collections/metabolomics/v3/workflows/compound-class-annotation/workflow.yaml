  - msms-spectra-canopus-class-prediction
  - classyfire-npclassifier-ontology-mapping
  - in-silico-class-prediction-interpretation
  - molecular-fingerprint-encoding--7b81bc09ce5106ca
  tools:
  - CANOPUS
  - ClassyFire
  - GNPS
  - NPClassifier
  - NPLinker
  - SIRIUS
  inputs:
  - type: tsv
  outputs:
  - type: tsv
  grounding:
    kb_slugs:
    - asb-paper-10-1021-acs-jnatprod-1c00399
    - asb-paper-10-1186-s40168-022-01444-3
    - asb-paper-10-3390-metabo12121275
