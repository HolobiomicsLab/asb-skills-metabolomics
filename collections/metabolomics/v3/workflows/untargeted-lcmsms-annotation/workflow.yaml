    - 10.1073/pnas.1608041113
    - 10.1101/2024.08.07.607073
    - 10.1101/2025.04.28.651123
    - 10.1371/journal.pcbi.1008724
  after:
  - preprocess
  candidate_tools:
  - MS2LDA
  - MS2LDAvis
  - Mass Bank
  - MassIVE
  - ChemWalker
  - GNPS library
  - GNPS2
  - GNPS2 (FBMN workflow)
  - MZmine
  - MZmine 2.53
  - RegFilter
  - MS2DECIDE
  - Spec2Vec
  - gensim (Word2Vec)
  - matchms
  - spec2vec_gnps_data_analysis
  inputs_from:
    preprocess:
    - mgf:gnps-fbmn
- id: sirius
  goal: MS2 spectra -> formula + structure + class (SIRIUS / CSI:FingerID / CANOPUS)
  edam_operation: http://edamontology.org/operation_3860
  skills:
  - batch-ms2-annotation-automation
  - msms-spectra-sirius-csi-fingerid-annotation
  - csi-fingerid-structure-annotation
  - insilico-formula-annotation-sirius
  tools:
