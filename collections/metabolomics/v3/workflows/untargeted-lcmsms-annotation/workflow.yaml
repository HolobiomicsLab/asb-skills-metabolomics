schema_version: 0.3.0
workflow_id: untargeted_lcmsms_annotation
kind: composite-workflow
techniques: []
steps:
- id: preprocess
  goal: raw mzML -> aligned feature table + MS2 exports (GNPS-FBMN mgf + SIRIUS mgf)
  edam_operation: http://edamontology.org/operation_3215
  skills:
  - lc-ms-peak-detection-and-feature-alignment
  - lcms-peak-detection-preprocessing
  - untargeted-metabolomics-preprocessing
  - lc-msms-feature-detection-and-alignment
  tools:
  - MS2LDA.Preprocessing.generate_corpus
  - MS2LDA.Preprocessing.load_and_clean
  - RMassBank
  - XCMS
  inputs:
  - type: mzML
  outputs:
  - type: feature-table
  - type: mgf
    flavour: gnps-fbmn
  - type: mgf
    flavour: sirius
  grounding:
    kb_slugs:
    - asb-paper-10-1021-acs-jnatprod-7b00737
    - asb-paper-10-1038-s41598-020-70850-0
    - asb-paper-10-1073-pnas-1608041113
    - asb-paper-10-1186-s13321-023-00724-w
    dois:
    - 10.1021/acs.jnatprod.7b00737
    - 10.1038/s41598-020-70850-0
    - 10.1073/pnas.1608041113
    - 10.1186/s13321-023-00724-w
  after: []
  candidate_tools:
  - R
  - apLCMS
  - doParallel
  - foreach
  - mzR
  - splines
  - OpenMS
  - Python
  - Snakemake
  - ThermoRawFileParser
  - UmetaFlow
  - pyOpenMS
  - MZmine2
  - Optimus
- id: qc_filter
  goal: (optional) remove blank / background / low-quality features before annotation
  edam_operation: http://edamontology.org/operation_3695
  skills:
  - lcms-feature-quality-filtering
  - blank-subtraction-quality-filtering
  - blank-vs-qc-intensity-ratio-filtering
  - blank-sample-removal-qc
  - blank-filtering-of-ms-features
  tools:
  - Pandas
  - TidyMS
  - pyopenms
  - scikit-learn
  inputs:
  - type: feature-table
  outputs:
  - type: feature-table
  grounding:
    kb_slugs:
    - asb-paper-10-1007-s00216-021-03392-7
    - asb-paper-10-1038-s41467-022-28391-9
    - asb-paper-10-1186-s13321-023-00724-w
    - asb-paper-10-1515-jib-2025-0047
    - asb-paper-10-3390-metabo10100416
