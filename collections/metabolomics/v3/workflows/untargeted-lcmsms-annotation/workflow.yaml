  - preprocess
  candidate_tools:
  - MSnbase
  - Metaboseek
  - mzR
  - xcms
  - GetFeatistics
  - MS-DIAL
  - R
  - patRoon
  - Jupyter
  - OpenMS
  - OpenMS 3.0
  - Python
  - Snakemake
  - UmetaFlow
  - FluoroMatch Flow 2.0
  - FluoroMatch Modular
  - LipidMatch
  - LipidMatch 4.2
