  - GNPS
  - tissueMASST
  inputs:
  - type: mgf
    flavour: gnps-fbmn
  outputs:
  - type: tsv
  grounding:
    kb_slugs:
    - asb-paper-10-1073-pnas-1608041113
    - asb-paper-10-1101-2024-08-07-607073
    - asb-paper-10-1101-2025-04-28-651123
    - asb-paper-10-1371-journal-pcbi-1008724
