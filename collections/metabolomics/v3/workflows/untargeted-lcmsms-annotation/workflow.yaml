  - qc_filter
  - network
  - library_match
  - sirius
  candidate_tools:
  - CSI:FingerID
  - ClassyFire
  - Empress
  - QIIME 2
  - Qemistree
  - q2-qemistree
  - MZmine2
  - Python
  - Qemistree (q2-qemistree)
  - R
  - Inventa
  - MZmine3
  - gnps_postprocessing
  - timaR
  inputs_from:
