  - preprocess
  candidate_tools:
  - Cytoscape
  - GNPS
  - MSConvert (ProteoWizard)
  - GNPS (Global Natural Products Social Molecular Networking)
  - Mascot Generic Format (MGF)
  - NP3 MS Workflow
  - Tremolo
  - MZmine2
  - OpenMS TOPPView
