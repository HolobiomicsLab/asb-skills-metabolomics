  - metabolomics-feature-table-processing
  - mass-spectral-library-matching-cleanup
  tools:
  - GNPS
  - ISDB-LOTUS
  - MS2DECIDE
  - Sirius
  - matchms
  inputs:
  - type: feature-table
  - type: graphml
  - type: tsv
  - type: metadata
  outputs:
  - type: tsv
  grounding:
    kb_slugs:
    - asb-paper-10-1002-cmtd-202400088
    - asb-paper-10-1038-s41589-020-00677-3
    - asb-paper-10-3389-fmolb-2022-1028334
