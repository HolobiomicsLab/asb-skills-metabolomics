  - type: mgf
    flavour: gnps-fbmn
  outputs:
  - type: graphml
  - type: tsv
  grounding:
    kb_slugs:
    - asb-paper-10-1021-acs-analchem-3c05829
    - asb-paper-10-1038-s41596-020-0317-5
    - asb-paper-10-1101-2024-08-07-607073
