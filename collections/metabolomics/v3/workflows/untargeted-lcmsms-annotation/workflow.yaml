    - 10.1021/acs.analchem.8b04698
    - 10.1021/acscentsci.3c00800
    - 10.1038/s41564-023-01575-9
  after:
  - preprocess
  candidate_tools:
  - CSI:FingerID
  - HILIC-Q Exactive HF mass spectrometry
  - OpenMS
  - UmetaFlow
  - pyOpenMS
  - Fast Search API
  - MZmine
  - Python 3.10
  - microbeMASST
