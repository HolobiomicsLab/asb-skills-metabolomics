  - ElemCor
  - MATLAB
  - MDT
  - ULS
  inputs:
  - type: tsv
  outputs:
  - type: tsv
  grounding:
    kb_slugs:
    - asb-paper-10-1007-s11306-018-1363-7
    - asb-paper-10-1021-acs-analchem-0c02998
    - asb-paper-10-1186-s12859-019-2669-9
    dois:
    - 10.1007/s11306-018-1363-7
    - 10.1021/acs.analchem.0c02998
    - 10.1186/s12859-019-2669-9
  after:
  - isotopologue_extract
  candidate_tools:
  - TarMet
  - enviPat
  - shiny
  - scipy.optimize.nnls
  - R
  - isoSCAN
  inputs_from:
