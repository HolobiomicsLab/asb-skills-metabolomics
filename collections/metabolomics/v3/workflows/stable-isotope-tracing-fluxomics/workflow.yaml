  - isotope-hypothesis-enumeration-from-mass-traces
  - isotope-adduct-ion-grouping
  - isotopologue-intensity-forward-calculation
  tools:
  - FeatureFinderMetabo
  - OpenMS
  inputs:
  - type: feature-table
  outputs:
  - type: tsv
  grounding:
    kb_slugs:
    - asb-paper-10-1021-acs-analchem-2c05810
    - asb-paper-10-1074-mcp-m113-031278
    - asb-paper-10-1186-s12859-019-3096-7
    dois:
    - 10.1021/acs.analchem.2c05810
    - 10.1074/mcp.m113.031278
    - 10.1186/s12859-019-3096-7
  after:
  - preprocess
  candidate_tools:
  - Python 3
  - asari
  - khipu
  - mass2chem
  - metDataModel
  - jsonpickle
  - moiety_modeling
  - numpy
  - scipy
  inputs_from:
