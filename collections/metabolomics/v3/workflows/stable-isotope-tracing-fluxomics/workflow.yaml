schema_version: 0.3.0
workflow_id: stable_isotope_tracing_fluxomics
kind: composite-workflow
techniques: []
steps:
- id: preprocess
  goal: raw labelled LC-MS -> aligned feature table (all isotopologues)
  edam_operation: http://edamontology.org/operation_3215
  skills:
  - isotopologue-peak-quantification
  - isotope-label-tracing-analysis
  - stable-isotope-lc-ms-annotation
  - retention-time-shift-correction-isotope-labelling
  tools:
  - MassSpecWavelet
  - PAFFT
  - TarMet
  - airPLS
  - enviPat
  - shiny
  inputs:
  - type: mzML
  outputs:
  - type: feature-table
  grounding:
    kb_slugs:
    - asb-paper-10-1007-s11306-018-1363-7
    - asb-paper-10-1021-ac202450g
    - asb-paper-10-1021-acs-analchem-5b03628
    - asb-paper-10-1038-s41467-022-28391-9
    dois:
    - 10.1007/s11306-018-1363-7
    - 10.1021/ac202450g
    - 10.1021/acs.analchem.5b03628
    - 10.1038/s41467-022-28391-9
  after: []
  candidate_tools:
  - MSnbase
  - Metaboseek
  - Metaboseek (LabelFinderModule)
  - xcms
  - R
  - X(13)CMS
  - devtools
  - geoRge
  - CAMERA
- id: isotopologue_extract
