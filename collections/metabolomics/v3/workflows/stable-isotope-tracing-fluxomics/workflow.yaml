  - natural_abundance_correction
  candidate_tools:
  - MetaboLabPy
  - metabolabpytools
  - numpy
  - pandas
  inputs_from:
    natural_abundance_correction:
    - tsv
- id: report
  goal: consolidate labelling / enrichment results into a tracing report table
