  - shiny
  inputs:
  - type: tsv
  outputs:
  - type: tsv
  grounding:
    kb_slugs:
    - asb-paper-10-1007-s11306-018-1363-7
    - asb-paper-10-1093-bioinformatics-btae373
    dois:
    - 10.1007/s11306-018-1363-7
    - 10.1093/bioinformatics/btae373
  after:
  - labelling_analysis
  candidate_tools:
  - MassSpecWavelet
  - PAFFT
  - enviPat
  - plotly
  - MetaboReport
  - R
  - R Shiny
  - ggplot2
  - golem
  inputs_from:
    labelling_analysis:
    - tsv
verification:
  final_outputs:
