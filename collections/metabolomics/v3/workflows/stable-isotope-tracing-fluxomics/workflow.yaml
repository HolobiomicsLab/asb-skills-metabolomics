- id: labelling_analysis
  goal: corrected distributions -> mass-isotopomer distribution / fractional enrichment
  edam_operation: http://edamontology.org/operation_3799
  skills:
  - mass-distribution-vector-enrichment-calculation
  - isotopomer-distribution-comparison
  tools:
  - ElemCor
  - IsoCor
  - MATLAB
  - MDT
  - ULS
  inputs:
  - type: tsv
  outputs:
  - type: tsv
  grounding:
    kb_slugs:
    - asb-paper-10-1186-s12859-019-2669-9
    - asb-paper-10-3390-metabo15010048
    dois:
    - 10.1186/s12859-019-2669-9
    - 10.3390/metabo15010048
