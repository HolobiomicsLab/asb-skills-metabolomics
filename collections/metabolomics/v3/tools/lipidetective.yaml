evidence_spans:
- a transformer model called LipiDetective was developed and trained on a dataset composed of reference spectra measured from lipid standards
- LipiDetective is an adaptation of the transformer model [25] and approaches the problem of lipid identification as a sequence-to-sequence task
- A greedy and a beam search method were implemented as prediction options.
- the integrated gradients [30] method was employed as provided by the Captum [31] library
- LipiDetective is an adaptation of the transformer model [25] and approaches the problem of lipid identification as a sequence-to-sequence task.
