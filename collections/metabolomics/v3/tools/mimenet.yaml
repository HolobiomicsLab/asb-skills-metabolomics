- python MiMeNet_train.py -micro data/IBD/microbiome_PRISM.csv -metab data/IBD/metabolome_PRISM.csv
- MiMeNet generates a background of SCC values using a similar approach as in _Cross-Validated Evaluation_.
- Then models are evaluated in a cross-validated fashion resulting in Spearman correlation coefficients (SCC) for each metabolite
- Here, we present MiMeNet, a neural network framework for modeling microbe-metabolite relationships.
