- we present our end-to-end mass spectrometry metabolomics workflow in the widely used platform, Galaxy
- To interact with Galaxy, open up a web-browser and point it at your server.
- The software is freely available on Galaxy (https://usegalaxy.org/, Jalili et al., 2020)
- IonFlow is a Galaxy tool written in R for ionomics data analysis
- SECIMTools leverages the Galaxy platform and enables integrated workflows for metabolomics data analysis
- Galaxy expects files in a tab separated format (tsv).
- The files available in both public repositories can be imported into Galaxy and used in SECIMTools.
- The Galaxy platform provides a framework for the easy construction and implementation of workflows.
