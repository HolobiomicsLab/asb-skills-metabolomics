evidence_spans:
- we present a framework for the 'Prioritization of candidate causal Genes at Molecular QTLs' (ProGeM)
- we introduced an analysis framework and highly configurable R script for the prioritization of candidate causal genes at molecular QTLs
- Each row provides annotation of a *"bottom-up"* candidate mediating gene
- ProGeM will highlight any bottom-up candidate mediating genes that contain either a sentinel or a proxy variant
