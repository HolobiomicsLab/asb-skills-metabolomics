- given that the [Lotus Dabase](https://lotus.naturalproducts.net/) uses the NPClassifyre ontology
- It assigns molecular structures to each mass feature of the metabolome by mapping them with a list of adducts and then querying LOTUS database
- makes use of general reaction rules and metabolite structures, stored in public databases like RetroRules [36] and LOTUS [37]
- The LOTUS database was converted to an SQLite format to be compatible with MEANtools
