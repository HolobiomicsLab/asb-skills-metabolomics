evidence_spans:
- The SVD-based pathways analysis method has been implemented in a web program [11] called PLAGE (pathway level analysis of gene expression).
- statistics for pathways and colormaps of expression profiles, were obtained using a web program we have developed called PLAGE
- The versions used for this article are available at the PLAGE website [11].
- we define the activity level of a pathway in a given sample as the 'level' of expression of a certain metagene in that sample, i.e., the level of the first metagene from the SVD
