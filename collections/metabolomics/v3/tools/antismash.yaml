evidence_spans:
- Several tools have been developed to mine genomes for these gene clusters, including antiSMASH (10)
- Using bioinformatics tools such as [antiSMASH](https://antismash.secondarymetabolites.org/), we can now take a genome sequence to identify BGCs and predict the secondary metabolites
- Querying [antiSMASH](https://antismash.secondarymetabolites.org/) BGCs
- BGCs were discarded if they were flagged by antiSMASH as lying on a contig-edge
- The BGCs predicted by antiSMASH are tokenised by detecting (sub)Pfams in each gene
- Overlap between predicted SubClusterBlast sub-clusters and output of both sub-cluster prediction methods
- we ran antiSMASH 6 on the genome of this strain and used iPRESTO to infer sub-clusters in the predicted BGCs
- antiSMASH 3.0 was used for identification of BGCs in the Streptomyces/Salinispora dataset.
- computational tools like antiSMASH have played a central role through the analysis of Biosynthetic Gene Clusters (BGCs)
- multiple genome mining approaches for the identification of BGCs have appeared, such as antiSMASH and DeepBGC
