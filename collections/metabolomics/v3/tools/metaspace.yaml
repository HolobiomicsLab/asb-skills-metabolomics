evidence_spans:
- automatically annotated using METASPACE
- used to identify isotope ions in MATASPACE30 and the rMSI package31
- are included into mass spectral annotation platforms like Mascot, METASPACE, and METLIN
- Documentation lives in the [GitHub Wiki](https://github.com/metaspace2020/metaspace/wiki)
- We previously developed METASPACE, an engine for metabolite annotation
- We used public datasets from METASPACE, a community-populated knowledge base of metabolite images
- '`condition_metadata` contains the [METASPACE](https://metaspace2020.eu/) dataset names for each replicate'
- we will use the annotation results and corresponding FDR thresholds to select metabolites as input query and corresponding universe for enrichment.
- the annotation results for each dataset in the [SpaceM](https://metaspace2020.eu/project/Rappez_2021_SpaceM?tab=datasets) project on METASPACE
