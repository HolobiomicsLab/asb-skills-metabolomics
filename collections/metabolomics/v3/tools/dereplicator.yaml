evidence_spans:
- Here we describe DEREPLICATOR+ algorithm for dereplicating spectra against diverse metabolites
- matches tandem mass spectra against the constructed post-translationally modified RiPPs structure database using Dereplicator
- Recently, we introduced DEREPLICATOR32 for searching spectral datasets against the database of peptidic natural products (PNPs)
- Here we report DEREPLICATOR+, an algorithm that improves on the previous approaches for identifying peptidic natural products
- DEREPLICATOR+ constructs the molecular network of all spectra and selects connected components with at least one identified spectrum.
- using Dereplicator (Mohimani *et al.*, 2017)
- in silico annotation tools (such as Network Annotation Propagation or DEREPLICATOR)
