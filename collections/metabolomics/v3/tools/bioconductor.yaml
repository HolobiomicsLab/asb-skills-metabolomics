evidence_spans:
- AutoTuner is available through BioConductor, and additional contributions are possible and encouraged.
- AutoTuner is freely distributed through BioConductor as an R package.
- it is based on the POMA R/Bioconductor package (http://www.bioconductor.org)
- BiocManager::install('ExperimentHub')
- Additional raw data for demonstration and extended testing is available through the BioC data package tartare.
- Implementing and combining methods from a diverse range of R/Bioconductor packages into 'omics' data analysis workflows
- struct and structToolbox are implemented in R, and are freely available from Bioconductor (http://bioconductor.org/packages/struct
- In total, this review summarises more than two hundred metabolomics specific packages primarily available on CRAN, Bioconductor and GitHub.
