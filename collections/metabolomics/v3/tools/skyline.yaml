evidence_spans:
- MassHunter 8 with Agile2, MRMkit,18 MRMprobs,19 and Skyline20
- we here present a targeted lipidomics workbench and lipid knowledge-base that is fully integrated with Skyline
- Skyline Tool Store
- DIA method preparation and data analysis were performed with Skyline (See Supplementary Methods).
- software developments such as Skyline15,16, which was further advanced by tools such as Panorama, and MSStats17,18
- It is also a native Skyline plugin (Skyline 64 bit, version 19.1 and above), which greatly facilitates vendor-independent assay development
- All LC-IM-MS data were further processed using Skyline 23.1.0.268
- LC-IMS-MS via Skyline library matching with m/z, RT, drift-time and idotp criteria
- While several open-source platforms (ASTS, MAVEN, MaxQuant, MRMAnalyzer, MRMPROBS, Skyline, SmartPeak, XCMS-MRM and METLIN-MRM, etc.)
- Peak areas of precursors and transitions were exported from Skyline
- the open-source and free software Skyline is the most popular software for quantitative omics.
