evidence_spans:
- Scores of MetFrag, MAGMa+, CFM-ID, CSI:FingerID (original) and CSI:FingerID IOKR were downloaded from the CASMI 2016 results web page
- MetFrag13, MAGMa+16, CFM-ID14 and CSI:FingerID15
- show retrievals rates comparable to or exceeding the ones obtainable by the current state-of-the-art solutions in the field
- a variety of tools are currently available to assist metabolite identification [MetFrag (Ruttkies et al., 2016; Wolf et al., 2010), CSI:FingerID (Dührkop et al., 2015), CFM-ID (Allen et al., 2014) etc
- In silico fragments were generated for all the adducts at three energy levels by using the docker image
- In silico fragments were generated for all the adducts at three energy levels by using the docker image (https://hub.docker.com/r/wishartlab/cfmid) of CFM-ID
- publicly available pretrained models of SIRIUS and CFM-ID
- we combine three spectra of low (<20 eV), medium (≥20 eV and <40 eV), and high (≥40 eV) collision energies per test molecule.
- compared with another open source in silico fragmenter, CFM-ID.
- 'CFM-ID: a web server for annotation, spectrum prediction and metabolite identification from tandem mass spectra'
- machine-learning assisted comparison with structural databases (e.g., SIRIUS4 and CFM-ID)
- the series of CFM-ID papers8,17−19 achieved state-of-the-art results in using a general rule-based fragmentation scheme
- CFM-ID is an advanced machine learning (ML) algorithm that predicts transition probabilities between fragments.
- bioinformatic tools, such as MetFrag15, CFM-ID16, MS-FINDER17, and SIRIUS18, have been developed to predict in silico MS/MS or molecular fingerprinting
- bioinformatic tools, such as MetFrag15, CFM-ID16, MS-FINDER17, and SIRIUS18, have been developed to predict in silico MS/MS
- CFM-ID applies stochastic Markov process to predict fragmentation spectra
- 'CFM-ID: A web server for annotation, spectrum prediction and metabolite identification from tandem mass spectra'
