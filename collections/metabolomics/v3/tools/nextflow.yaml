evidence_spans:
- The pipeline is built using [Nextflow](https://www.nextflow.io) version 23.04.2.5870 (IMPORTANT), a workflow tool to run tasks across multiple compute infrastructures
- The pipeline is built using [Nextflow](https://www.nextflow.io) version 23.04.2.5870
- MOI is a nextflow pipeline (Tommaso et al. 2017) with its dependencies stored with Docker (Merkel 2014)
- 'To learn NextFlow checkout this documentation:'
- You will need to have conda, mamba, and nextflow installed to run things locally.
- The analysis workflow was implemented as a modular pipeline in the workflow manager Nextflow, including containers with software dependencies.
- nextflow run action.nf
- conda install -c bioconda nextflow:22.04.0
- nextflow run action.nf --help
- We chose Nextflow as our workflow management system, since it allows flexible development, can be run on different platforms, supports containers
