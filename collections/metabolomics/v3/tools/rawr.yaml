evidence_spans:
- rawR.exe utilizes the New Raw File Reader .Net assembly provided by Thermo Fisher Scientific
- The base::system2 R function invokes methods compiled in the compiled rawR.exe .NET application.
- The package provides functions to create and validate class instances (objects), but typically instances are generated by reader functions that expect rawfiles as input data
