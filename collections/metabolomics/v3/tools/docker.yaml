evidence_spans:
- The API and frontend were containerized with docker and deployed on AWS Elastic Beanstalk
- '- **Docker**, for the msconvert sidecar that converts RAW mass-spectrometry files.'
- MsConvert in a docker container is called by the chem-spectra-app to achieve this job.
- COCONUT web interface, back-end and database are entirely Dockerised, allowing a quick and easy deployment
- 'The requirements on your local system are: 1. Docker 2. Docker Compose'
- our preferred and recommended way is using docker/docker-compose as it provides a more consistent experience
- Deploying to your own web server with docker. `docker pull databio2022/graphbio:v2.2.7-manual`
- docker pull zmahnoor/maw-r:1.0.8 --platform=linux/amd64
- Installation is facilitated by Docker (Anderson 2015), which pre-installs all required libraries and packages with a single button click.
- MetaboShiny is available on Docker Hub under the jcwolthuis/MetaboShiny repository
- 'MetaMOPE is freely available at https://metamope.cmdm.tw. Source code and installation instructions are available on GitHub: https://github.com/CMDM-Lab/MetaMOPE.'
- MetaMOPE is freely available at https://metamope.cmdm.tw. Source code and installation instructions are available on GitHub
- We also constructed a Docker Image for users to create their web service and deploy the application into any environment without installing the webserver.
- It uses Docker/Singularity containers making installation trivial and results highly reproducible.
- MOI was developed using nextflow and Docker, allowing it to be easily deployed and scaled to accommodate large datasets
- You can use [Docker](https://www.docker.com/get-started) to run the `npanalyst` CLI
- You can use [Docker](https://www.docker.com/get-started) to run the `npanalyst` CLI by binding a local volume.
- POMAShiny has been containerized using Docker. The Docker image is freely available at DockerHub
- Docker images and a docker-compose setup file are also provided for easy deployment, along with demo data.
- a Docker image was created using a Linux OS base image to encapsulate Shinyscreen along with its dependencies.
- portable software containers such as Apptainer/Singularity [33] or Docker [34] that capture the runtime environment of a workflow or a workflow module
- Nextflow automatically pulls all necessary Docker containers from Dockerhub
- Nextflow automatically pulls all necessary Docker containers from Dockerhub, when using the default `nextflow.config` file.
- Each module of the workflow is provided with their own Docker container to ensure portability and eliminate the need for local software installations
- each of them embedded in Docker images, sharing a data volume and communicating together through AJAX web services
- each of them embedded in Docker images, sharing a data volume
- each of them embedded in Docker images
