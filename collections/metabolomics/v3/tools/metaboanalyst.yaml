evidence_spans:
- the web-based visualization tools JSpecView [5, 6], NMRPro [7], MetaboAnalyst [8], MetaboHunter [9], COLMAR [10], jsNMR [11], and SpeckTackle [12] are known.
- MetaboAnalyst [15–17] is a popular metabolomics data processing web-tool providing kNN, Probabilistic PCA (PPCA), Bayesian PCA (BPCA), SVD
- Several dedicated web-based platforms are available for the analysis of metabolomic data, such as the well-established Metabo Analyst
- All these statistics are also available in other statistics programs such as MetaboAnalyst, LipidSuite, or Lipid Mini-On.
- NOREVA17 and SERRF18 for normalization, and MetaboAnalyst19 for statistical analysis.
- MetaboAnalyst and various R packages for statistical analysis
- MetaboAnalystR 4.0 is the backend of the MetaboAnalyst 6.0 web application52
- we provide long-term stable (LTS) release of [MetaboAnalyst-Pro](https://www.xialab.ca/pro/protools.xhtml) with Enterprise Solution for local installation
- web-based applications such as UltraMassExplorer (UME) [27], FREDA [28], MetaboAnalyst [29], and DropMS [30]
- publicly available statistical data analysis tools such as MetaboAnalyst
- we anticipate that metaboprep will be used in conjunction with complementary tools such as MetaboAnalyst (Pang et al., 2021)
- head to <a href='https://www.metaboanalyst.ca/MetaboAnalyst/upload/ConvertView.xhtml' target='_blank'>MetaboAnalyst</a> for the ID conversion
- For the conversion of compound names to KEGG identifiers, the MetaboAnalyst 4.0 [47] ID conversion tool was used
- Pathway enrichment analysis of uniquely identified differential metabolites using Metaboanalyst [42]
- open-source tools developed by the research community (e.g., XCMS, MZmine, OpenMS, and MetaboAnalyst)
- Among the most well-known metabolomics workflow tools are MetaboAnalyst (Chong & Xia, 2020) and XCMS Online
- R packages including ropls, Metabo AnalystR, Hmisc, pROC, random Forest, and Boruta were utilized for analysis.
- Plenty of open-source platforms, including Metaboanalyst (Chong et al., 2018), W4M (Giacomoni et al., 2015), Galaxy-M
- several methods exist for metabolite enrichment, with [MetaboAnalyst](https://www.metaboanalyst.ca/) being the most popular.
- to construct a method that can complement established tools for NMR data analysis like MetaboAnalyst [12], by improving performance
- a method that can complement established tools for NMR data analysis like MetaboAnalyst [12], by improving performance, analysis quality and reproducibility.
- This method is widely used in the web-based tools XCMS Online [38] and MetaboAnalyst [39]
- MZmine2 (Pluskal et al. 2010), MetaboAnalyst (Xia et al. 2015) and metabolomics specific Galaxy workflows
