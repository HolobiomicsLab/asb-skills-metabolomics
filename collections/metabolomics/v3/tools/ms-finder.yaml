evidence_spans:
- All features with MS2 information were exported for MS-FINDER analysis performed in batch mode.
- For subsequent structural elucidation in MS-FINDER, both the most intense and most connected features were kept.
- output of available computational metabolite annotation tools (ISDB-DNP, MS-Finder, Sirius)
- bioinformatic tools, such as MetFrag15, CFM-ID16, MS-FINDER17, and SIRIUS18, have been developed to predict in silico MS/MS or molecular fingerprinting
