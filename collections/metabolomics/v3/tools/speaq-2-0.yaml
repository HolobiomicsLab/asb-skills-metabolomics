evidence_spans:
- we present speaq 2.0. This completely revised framework to automatically analyze 1D NMR spectra uses wavelets
- Since version 2.0 a lot of functionality is added but the original functionality is maintained.
- The speaq 2.0 method, based on finding peaks and subsequently grouping, performs similar or better compared to the other methods
- This problem is however detected by the optional SilhouetR function in speaq 2.0 which calculates the silhouette values for each group.
- In this paper, we present the speaq 2.0 method.
