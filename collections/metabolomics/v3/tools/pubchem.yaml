evidence_spans:
- Name (as “title”), PubChem ID or CID, InChI, InChIKey, SMILES
- PubChem (https://pubchem.ncbi.nlm.nih.gov) [1–3] is a chemical data repository and open chemistry database
- molecular structure databases such as Pubchem [36] contain millions of compounds
- an extensive automated lookup search was run against PubChem [35] (via pubchempy [36])
- the metadata is searched in PubChem
- The structures can be searched in public databases PubChem, ChemSpider, ChEBI, NP Atlas, COCONUT, and Norine
- This filter derives the canonical SMILES, InChI and InChIKey from PubChem.
- compared with Pubchem (https://pubchem.ncbi.nlm.nih.gov/) and Chemspider (https://www.chemspider.com/) databases
- candidate structures were retrieved from the compound databases PubChem and ChemSpider in June, 2015
- retrieval of reference, data source and patent information via ChemSpider and PubChem web services
- If no structure information is provided, it is queried from PubChem by Name search.
- adds PubChem and KEGG profiles
- communicates with public chemistry utilities (including PubChem and the National Cancer Institute)
- categorate(detail = "research")` adds PubChem and KEGG profiles, source
