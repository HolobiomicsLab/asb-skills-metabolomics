evidence_spans:
- To import these data into R, use the mpactr function `import_data()`
- To check for mispicked ions, use mpactr function `filter_mispicked_ions()`
- mpactR automates pre-processing of liquid chromatography-tandem mass spectrometry (LC-MS/MS) data from microbiological samples
- The goal of mpactr is to correct for errors that occur during the pre-processing of raw tandem MS/MS data
- Non-reproducible ions are identified by coefficient of variation (CV) between technical replicates with `filter_cv()`
- use mpactr function `filter_mispicked_ions()`
