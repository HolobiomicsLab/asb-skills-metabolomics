evidence_spans:
- The DNEA R package is available to download on GitHub (http://www.github.com/Karnovsky-Lab/DNEA/).
- The DNEA, Filigree and Metabox2 networks were filtered to include edges with an absolute value of correlation coefficient greater than or equal to 0.2.
- These data are also included in the DNEA R package.
- TEDDYdat <- stabilitySelection(object = TEDDYdat, subSample = TRUE,
- TEDDYdat <- clusterNet(TEDDYdat, tau = 0.5,
- The `aggregateFeatures()` function makes available the **correlation-based**, **knowledge-based**, and **hybrid** collapsing methods from Filigree.
