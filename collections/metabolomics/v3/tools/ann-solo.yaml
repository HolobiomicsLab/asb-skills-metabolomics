evidence_spans:
- The spectrum preprocessing settings are as described in section 2.1.1.
- To perform an open search ANN-SoLo employs a cascade search strategy consisting of two levels
- For all HEK293 searches a fragment mass tolerance of 0.02 Da was used.
- The ANN-SoLo software is written in Python
- ANN indexing during the candidate selection step is based on the open-source Approximate Nearest Neighbors Oh Yeah (Annoy) library
- Here we present the Approximate Nearest Neighbor Spectral Library (ANN-SoLo) search tool, which has been optimized for fast and accurate open modification spectral library searching.
- Top 500 precursor mass differences from the ANN-SoLo open modification search of GLEAMS cluster centroids.
