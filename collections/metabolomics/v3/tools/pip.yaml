evidence_spans:
- Install Python 3.7 (or newer) [[link]](https://www.python.org/downloads/) and use `pip` as follows to install dependencies.
- pip install -r requirements.txt
- 'From the root of the GLEAMS repository (e.g. `cd GLEAMS`), use pip to install GLEAMS:'
- pip install git+https://github.com/bittremieux/GLEAMS.git
- pip install gdown
- '## Requirements for running:


  ```bash

  pip install requirements

  ```'
- pip install -e .
- pip or conda package manager
- Use `pip install deeprtalign` to install deeprtalign
- 'All dependencies can be installed using:

  ```pip install Jupyter_notebook_package_requirements.txt```'
- Use `pip` to **install PhysioFit from GitHub**
- $ pip install multinmrfit
- pip install reconstructor
