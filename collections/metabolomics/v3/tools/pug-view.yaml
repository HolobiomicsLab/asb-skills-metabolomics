evidence_spans:
- One of these is PUG-View, which is a Representational State Transfer (REST)-style web service interface specialized for accessing annotation data contained in PubChem.
- The annotations presented under a given (sub)heading of the Summary/Record or View page can be retrieved by specifying the (sub)heading of interest as an optional parameter
- PUG-View also handles a variety of special reports for more specialized data, each with its own unique data model
- One can retrieve these LCSS data by using an optional parameter to PUG-View (Table 1)
- PUG-View provides annotation data in several formats, including XML
