evidence_spans:
- we introduce AriumMS (augmented region of interest for untargeted metabolomics mass spectrometry) as a reliable toolbox for multi-platform metabolomics
- Here, we present the novel open-source AriumMS (augmented region of interest for untargeted metabolomics mass spectrometry) software
- AriumMS contains ROI search, preprocessing, feature detection and integration, false-positive filter, scaling, and transformation followed by the augmentation and various chemometric data evaluation
- The AriumMS software toolbox presented here is a powerful tool for fast untargeted processing of these augmented datasets.
