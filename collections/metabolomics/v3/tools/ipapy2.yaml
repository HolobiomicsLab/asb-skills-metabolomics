evidence_spans:
- the ipaPy2 library provides a function (clusterFeatures()) able to perform such step
- The first step of the IPA pipeline consists in the mapping of the isotope patterns within the dataset considered. This is achieved through the map_isotope_patterns().
- pip install ipaPy2
- fragmentation data can be included in the annotation process by using the MSMSannotation() function
- If no fragmentation data is available, the MS1annotation() function should be used
