evidence_spans:
- devtools::load_all()
- devtools::install_gitlab('joerg.buescher/automRm@master', host = 'https://gitlab.gwdg.de')
- Install "JPA" from Github using "devtools".
- Install "devtools" package from CRAN if you do not already have it installed.
- library(devtools)
- install_github('computational-metabolomics/struct')
- 'installed directly from R or RStudio using the developer tools: ''devtools::install_github("castratton/uafR")'''
- install.packages("devtools")
- if (!require("devtools")) install.packages("devtools")
