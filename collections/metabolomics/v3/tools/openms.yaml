evidence_spans:
- provide your code as a pull request for inclusion into OpenMS
- implemented and integrated in the open-source framework OpenMS (version 1.10) as the software tool FeatureFinderMetabo
- The algorithm is available as part of the open-source software package OpenMS and runs on all major operating systems.
- In comparison with the feature alignment methods in OpenMS, MZmine2 and XCMS on three public metabolomics benchmark datasets
- For example, XCMS6, MS-DIAL7, MZmine8, El-MAVEN9, OpenMS10, and TidyMass11 do not directly annotate ISFs and often report many false positive features
- a wrapper for OpenMS (Röst et al., 2016) with a strong focus on processing and filtering of raw mass spectral data
- strategic partnerships will be established not only with major MS vendors but also with developers of existing "keystone" software, e.g., OpenMS, ProteoWizard, METASPACE
- Several open-source data processing tools, such as OpenMS and MZmine, offer features like baseline noise filtering, retention time alignment
- such as CFM-ID [30, 31], enviMass [32], enviPick [33], nontarget [34], GenForm [35], MetFrag [36]
- such as CFM-ID [30, 31], enviMass [32], enviPick [33], nontarget [34], GenForm [35], MetFrag [36], FOR-IDENT [37], MS-DIAL [38], MS-FINDER [39], MZmine [40], OpenMS [41]
- 'OpenMS: a flexible open-source software platform for mass spectrometry data analysis'
- open-source tools developed by the research community (e.g., XCMS, MZmine, OpenMS, and MetaboAnalyst)
- py OpenMS [20] to expose the rich functionality of OpenMS [19, 22] from C++ to Python.
- Install OpenMS manually
- using OpenMS [17] 3.0 tools for feature detection, map alignment, adduct annotation, re-quantification and feature linking
- a set of Python bindings to the OpenMS algorithms (pyOpenMS)
- Runs grid searches over controller parameters and evaluates each run with OpenMS. Results summarise coverage and intensity.
- DeepRTAlign supports Dinosaur, OpenMS, MaxQuant, XICFinder
- --method {Dinosaur,XICFinder,OpenMS,MaxQuant,TXT,CSV}, -m {Dinosaur,XICFinder,OpenMS,MaxQuant,TXT,CSV}
- DeepRTAlign owns higher precision and recall values than OpenMS on the proteomic datasets
- https://rickhelmus.github.io/patRoon/articles/tutorial.md
- Support for the algorithms of cliqueMS (Senan et al., 2019) and OpenMS (Metabolite Adduct Decharger) (Röst et al., 2016).
- OpenMS (Bertsch et al. 2010) is a library for LC–MS data analysis. It was originally designed for proteomics
- the metabolites (5% RMS) isotope model from OpenMS was used to exclude features with unusual peak shapes of isotopic traces
- pyOpenMS, a Python interface to the C++ OpenMS library
