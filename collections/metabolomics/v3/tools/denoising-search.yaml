evidence_spans:
- Denoising Search detected 2.3-fold more annotated compounds compared to the Exploris 240 Orbitrap instrument
- Denoising Search starts by denoising the experimental spectra using all molecular formulas that fall within the predefined precursor mass accuracy
- The ``denoising_search`` function, which is the core function of the project, performs identity search with spectral denoising integrated.
