evidence_spans:
- CheBI ID, HMDB ID, KEGG ID, LipidMaps ID, DrugBank ID, CAS number
- Met-ID is based on the openly available HMDB and LIPID MAPS
- Curated sets of metabolites associated with each putative gene were parsed from files available from the HMDB web portal (hmdb.ca, April 1st 2019)
- The first postanalysis module, peak identification, utilizes m/z data from HMDB and MassBank for matching purposes
- perform an accurate mass search (10 ppm mass error) against the HMDB
