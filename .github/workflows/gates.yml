name: Domain content gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  released-collections:
    name: ${{ matrix.collection.collection_path }}
    strategy:
      fail-fast: false
      matrix:
        collection:
            - domain: metabolomics
              collection_path: collections/metabolomics/v3
              # The receipt under receipts/0aff65e99ace/ was regenerated on 10 November
              # 2026 with the tooling pinned below and verifies with it, with or without
              # the builder package. It digests the gate implementation, so a later pin
              # that changes the gate needs a new receipt or an empty receipts_path.
              receipts_path: "receipts/0aff65e99ace"
            # v2 is not in the matrix: its receipt predates the strict gate and the
            # local strict rehearsal of 2026-11-09 fails on it (release surface,
            # release gate and receipt re-verification). Add it back once the
            # maintainers regenerate its receipt or the caller gains a per-row strict flag.
    # Pin the tooling commit whose gate wrote the v3 receipt (v3.0.1 carries the T2 remap, so the strict EDAM gate holds).
    # Bump this full commit SHA deliberately when adopting newer gate tooling.
    uses: HolobiomicsLab/asb-skill-collections/.github/workflows/domain-gates.yml@231942a2324b74b6bc3f19ae1668707c8d063e25
    with:
      domain: ${{ matrix.collection.domain }}
      collection_path: ${{ matrix.collection.collection_path }}
      receipts_path: ${{ matrix.collection.receipts_path }}
      strict: true
      edam_strict: true
